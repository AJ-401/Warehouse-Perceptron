  <script>
    const STORAGE_KEY = 'godrej_supervisor_chat_history_v2';

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function scrollChatToBottom(smooth = true) {
      const canvas = document.getElementById('chatCanvas');
      if (canvas) {
        setTimeout(() => {
          canvas.scrollTo({
            top: canvas.scrollHeight,
            behavior: smooth ? 'smooth' : 'auto'
          });
        }, 60);
      }
    }

    function getStoredChats() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.warn('Failed to parse chat history from localStorage', e);
        return null;
      }
    }

    function saveStoredChats(chats) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
        updateChatCountBadge(chats.length);
      } catch (e) {
        console.warn('Failed to save chat history to localStorage', e);
      }
    }

    function updateChatCountBadge(count) {
      const badge = document.getElementById('chatCountBadge');
      if (badge) {
        badge.textContent = `${count} ${count === 1 ? 'EXCHANGE' : 'EXCHANGES'} STORED`;
      }
    }

    function triggerInquiry(queryText) {
      const input = document.getElementById('userQueryInput');
      if (input) input.value = queryText;
      runProcessingSequence(queryText);
    }

    function handleAskAssistant() {
      const input = document.getElementById('userQueryInput');
      const query = input && input.value.trim() ? input.value.trim() : "What was the most common risky behaviour detected?";
      runProcessingSequence(query);
    }

    function renderUserBubble(turn, animate = false) {
      const userWrap = document.createElement('div');
      userWrap.className = `flex justify-end ${animate ? 'fade-enter' : ''}`;
      userWrap.innerHTML = `
      <div class="max-w-2xl bg-surface-container border border-outline-variant/40 p-3.5 shadow-sm text-left">
        <div class="font-label-caps text-label-caps text-outline mb-1 text-right">SUPERVISOR QUERY // ${turn.timestamp || 'LOGGED'}</div>
        <p class="font-body-md text-body-md text-on-surface font-medium">${escapeHtml(turn.query)}</p>
      </div>
    `;
      return userWrap;
    }

    function renderAssistantCard(turn, animate = false) {
      let renderedHtml = "";
      if (typeof marked !== 'undefined' && marked.parse) {
        renderedHtml = marked.parse(turn.answer || "", { gfm: true, breaks: true });
      } else {
        renderedHtml = escapeHtml(turn.answer || "").replace(/\n/g, '<br>');
      }

      let evidenceHtml = "";
      if (turn.event_ids && turn.event_ids.length > 0) {
        const pills = turn.event_ids.slice(0, 15).map(id => `
        <button class="px-2.5 py-1 bg-surface-container-lowest hover:bg-surface-container-high border border-outline-variant/40 hover:border-primary-container text-on-surface-variant hover:text-primary font-mono-data-sm text-xs flex items-center gap-1.5 transition-all cursor-pointer group" onclick="alert('Evidence Details: ${id}')">
          <span class="w-1.5 h-1.5 bg-primary-container group-hover:scale-125 transition-transform"></span>
          <span class="font-semibold text-on-surface group-hover:text-primary">${id}</span>
        </button>
      `).join('');

        evidenceHtml = `
        <div class="p-3.5 bg-surface-container/50 border border-outline-variant/30 space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-outline" style="font-size: 16px;">receipt_long</span>
              <span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">EVIDENCE // GROUNDED IN DETECTED EVENTS:</span>
            </div>
            <span class="font-mono-data-sm text-mono-data-sm text-primary-container">${turn.event_ids.length} Grounded Events</span>
          </div>
          <div class="flex flex-wrap gap-2">
            ${pills}
          </div>
        </div>
      `;
      }

      const card = document.createElement('div');
      card.className = `${animate ? 'fade-enter' : ''} w-full bg-surface-container-lowest border border-outline-variant/30 p-6 space-y-5 shadow-md mb-6`;
      card.innerHTML = `
      <div class="flex items-center justify-between border-b border-outline-variant/20 pb-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 bg-primary-container shadow-[0_0_8px_#00e5ff]"></span>
          <span class="font-label-caps text-label-caps text-primary-container uppercase tracking-widest font-semibold">INTELLIGENCE SYNTHESIS</span>
          <span class="text-outline-variant/50">/</span>
          <span class="font-mono-data-sm text-mono-data-sm text-outline">GROUNDED IN EVENT LEDGER</span>
        </div>
        <span class="font-mono-data-sm text-mono-data-sm text-outline">CONFIDENCE: <strong class="text-on-surface font-semibold">${turn.confidence || '98.4%'}</strong></span>
      </div>

      <div class="space-y-4">
        <div class="prose-chat">
          ${renderedHtml}
        </div>
      </div>

      ${evidenceHtml}

      <div class="pt-1 flex items-center gap-2 font-mono-data-sm text-mono-data-sm text-outline/80">
        <span class="material-symbols-outlined text-outline/70" style="font-size: 15px;">verified_user</span>
        <span>Responsible AI: Operational analysis is strictly grounded in facility and ergonomic events. Zero worker scorekeeping.</span>
      </div>
    `;
      return card;
    }

    function getProcessingBannerEl() {
      let banner = document.getElementById('processingBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'processingBanner';
        banner.className = 'hidden p-3.5 bg-surface-container-lowest/90 border border-primary-container/40 flex items-center justify-between transition-all duration-300';
        banner.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 px-1 py-0.5">
            <span class="w-2 h-2 rounded-full bg-primary-container dot-1"></span>
            <span class="w-2 h-2 rounded-full bg-primary-container dot-2"></span>
            <span class="w-2 h-2 rounded-full bg-primary-container dot-3"></span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-mono-data-sm text-mono-data-sm text-primary-container tracking-wider font-semibold" id="processingStepText">ANALYZING EVENT LOG...</span>
          </div>
        </div>
        <div class="font-mono-data-sm text-mono-data-sm text-outline flex items-center gap-2">
          <span class="text-[10px] text-outline">GROUNDED RUNTIME</span>
          <span class="px-1.5 py-0.5 bg-surface-container border border-outline-variant/30 text-primary-container text-[11px]">42ms</span>
        </div>
      `;
      }
      return banner;
    }

    async function runProcessingSequence(queryText) {
      const aiBadge = document.getElementById('aiIndicatorBadge');
      const aiIcon = document.getElementById('aiIcon');
      const stepText = document.getElementById('processingStepText');
      const threadContainer = document.getElementById('threadContainer');
      const input = document.getElementById('userQueryInput');
      const askBtn = document.getElementById('askBtn');

      if (!threadContainer) return;

      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];

      // 1. Append User Message Bubble
      const turn = {
        id: 'chat_' + Date.now(),
        timestamp: timeStr,
        query: queryText,
        answer: '',
        event_ids: [],
        confidence: '98.4%'
      };

      const userWrap = renderUserBubble(turn, true);
      threadContainer.appendChild(userWrap);

      if (input) input.value = '';

      // 2. Display Processing Banner at bottom
      const processingBanner = getProcessingBannerEl();
      threadContainer.appendChild(processingBanner);
      processingBanner.classList.remove('hidden');
      scrollChatToBottom(true);

      // 3. Visual Indicators
      if (aiBadge) aiBadge.classList.add('ai-indicator-active', 'border-primary-container');
      if (aiIcon) aiIcon.classList.add('text-primary-container', 'animate-pulse');
      if (askBtn) askBtn.classList.add('opacity-70', 'pointer-events-none');

      let step = 0;
      const steps = [
        "1/4 ANALYZING EVENT LOG...",
        "2/4 QUERYING DETECTED EVENTS...",
        "3/4 CORRELATING BEHAVIOURS & RISKS...",
        "4/4 SYNTHESIZING GROUNDED ANSWER..."
      ];
      if (stepText) stepText.textContent = steps[0];
      const stepInterval = setInterval(() => {
        step = (step + 1) % steps.length;
        if (stepText) stepText.textContent = steps[step];
      }, 700);

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'supervisor', question: queryText })
        });

        clearInterval(stepInterval);

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || `Server returned status ${resp.status}`);
        }

        const data = await resp.json();
        turn.answer = data.answer;
        turn.event_ids = data.event_ids || [];

        // Append assistant card
        const card = renderAssistantCard(turn, true);
        threadContainer.appendChild(card);

        // Save to persistent storage
        const chats = getStoredChats() || [];
        chats.push(turn);
        saveStoredChats(chats);

      } catch (err) {
        clearInterval(stepInterval);
        turn.answer = `**⚠️ Service Notice:** ${err.message}\n\nPlease verify that the backend is running at \`http://localhost:8000\`.`;
        turn.event_ids = [];
        const card = renderAssistantCard(turn, true);
        threadContainer.appendChild(card);

        const chats = getStoredChats() || [];
        chats.push(turn);
        saveStoredChats(chats);

      } finally {
        if (processingBanner) processingBanner.classList.add('hidden');
        if (aiBadge) aiBadge.classList.remove('ai-indicator-active', 'border-primary-container');
        if (aiIcon) aiIcon.classList.remove('animate-pulse');
        if (askBtn) askBtn.classList.remove('opacity-70', 'pointer-events-none');
        scrollChatToBottom(true);
      }
    }

    // Seed default demonstration conversation if fresh installation
    function getDefaultSeedChat() {
      return [
        {
          id: 'seed_01',
          timestamp: '14:48:12',
          query: 'What was the most common risky behaviour during the morning shift?',
          answer: `### Grounded Shift Synthesis: Morning Operations\n\nBased on 250 logged events in Bay 01 and Dock Leveler between 06:00 and 14:00, the primary risk category observed was **Product Dragging and Improper Material Handling** (42.0% share of total risk observations).\n\n- **Primary Hotspot:** Loading Bay 01 / Unloading Gate A\n- **Near-Miss Frequency:** 15 classified near-miss sequences\n- **High Risk Incidents:** 38 events exceeded 70% tilt/velocity risk threshold\n\n#### Immediate Operational Recommendation:\nExecute **SOP-LOG-108** (Trolley handling and pallet clearance refresher) before the evening dispatch cycle.`,
          event_ids: ['EVT-20260908-0012', 'EVT-20260908-0018', 'EVT-20260908-0027', 'EVT-20260908-0042'],
          confidence: '98.2%'
        }
      ];
    }

    // Initialize and load chat history from LocalStorage or server
    async function initChatHistory() {
      const threadContainer = document.getElementById('threadContainer');
      if (!threadContainer) return;

      let chats = getStoredChats();

      if (!chats || chats.length === 0) {
        // Try to recover from server /api/chat_history
        try {
          const resp = await fetch('/api/chat_history?username=supervisor');
          if (resp.ok) {
            const resData = await resp.json();
            const serverHistory = resData.history || [];
            if (serverHistory.length > 0) {
              chats = [];
              let currentQ = null;
              for (const item of serverHistory) {
                if (item.role === 'user') {
                  currentQ = item.content;
                } else if (item.role === 'assistant') {
                  if (currentQ) {
                    chats.push({
                      id: 'srv_' + chats.length,
                      timestamp: 'SAVED SESSION',
                      query: currentQ,
                      answer: item.content || '*(Answer recorded in ledger)*',
                      event_ids: [],
                      confidence: '98.4%'
                    });
                    currentQ = null;
                  }
                }
              }
            }
          }
        } catch (e) {
          console.warn('Could not fetch server chat history', e);
        }
      }

      if (!chats || chats.length === 0) {
        chats = getDefaultSeedChat();
      }

      // Save back to ensure localStorage is in sync
      saveStoredChats(chats);

      // Render all conversation turns into threadContainer
      threadContainer.innerHTML = '';
      chats.forEach(turn => {
        threadContainer.appendChild(renderUserBubble(turn, false));
        threadContainer.appendChild(renderAssistantCard(turn, false));
      });

      // Make sure processing banner element exists in threadContainer (hidden)
      const banner = getProcessingBannerEl();
      threadContainer.appendChild(banner);

      updateChatCountBadge(chats.length);
      scrollChatToBottom(false);
    }

    async function clearChatHistory() {
      if (!confirm('Are you sure you want to clear your conversation history and reset the session?')) {
        return;
      }

      try {
        localStorage.removeItem(STORAGE_KEY);
        await fetch('/api/chat_history?username=supervisor', { method: 'DELETE' });
      } catch (e) {
        console.warn('Error clearing history', e);
      }

      const threadContainer = document.getElementById('threadContainer');
      if (threadContainer) {
        const seed = getDefaultSeedChat();
        saveStoredChats(seed);

        threadContainer.innerHTML = '';
        seed.forEach(turn => {
          threadContainer.appendChild(renderUserBubble(turn, false));
          threadContainer.appendChild(renderAssistantCard(turn, false));
        });
        const banner = getProcessingBannerEl();
        threadContainer.appendChild(banner);
        updateChatCountBadge(seed.length);
      }

      alert('✓ Conversation history has been cleared and reset.');
    }

    // Load live telemetry metrics from backend
    async function loadLiveMetrics() {
      try {
        const res = await fetch('/api/metrics');
        if (!res.ok) return;
        const m = await res.json();

        const totalEl = document.getElementById('statTotalEvents');
        if (totalEl && m.total_events) totalEl.textContent = `${m.total_events} EVENTS`;

        const availEl = document.getElementById('statEventsAvail');
        if (availEl && m.total_events) availEl.textContent = m.total_events;

        const nmEl = document.getElementById('statNearMiss');
        if (nmEl && m.near_miss_count !== undefined) nmEl.textContent = `${m.near_miss_count} NEAR-MISS`;

        const hrEl = document.getElementById('statHighRisk');
        if (hrEl && m.risk_levels) {
          const count = (m.risk_levels.high || 0) + (m.risk_levels.critical || 0);
          hrEl.textContent = `${count} HIGH RISK`;
        }

        if (m.top_behaviours && m.top_behaviours.length > 0) {
          const topB = m.top_behaviours[0];
          const nameEl = document.getElementById('statTopBehaviourName');
          if (nameEl) nameEl.textContent = topB.behaviour.replace(/_/g, ' ');
          const shareEl = document.getElementById('statTopBehaviourShare');
          if (shareEl) shareEl.textContent = `${topB.share}% share`;
        }
      } catch (e) {
        console.log('Metrics endpoint unavailable, using cached values');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadLiveMetrics();
      initChatHistory();
    });

  </script>


  <script>
    function updateAssistClock() {
      const el = document.getElementById('assist-clock');
      if (el) {
        const now = new Date();
        el.textContent = now.toTimeString().split(' ')[0];
      }
    }
    setInterval(updateAssistClock, 1000);
    updateAssistClock();
  </script>
